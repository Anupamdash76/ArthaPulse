<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#172136" />
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="496" height="496" x="8" y="8" rx="120" fill="none" stroke="#f59e0b" stroke-opacity="0.35" stroke-width="10" />

  <!-- Pulse / Activity Icon -->
  <g filter="url(#glow)">
    <path
      d="M 96 256 L 176 256 L 216 144 L 272 368 L 328 208 L 368 256 L 416 256"
      stroke="url(#pulseGrad)"
      stroke-width="38"
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="none"
    />
    <!-- Accent Dots -->
    <circle cx="216" cy="144" r="14" fill="#fbbf24" />
    <circle cx="272" cy="368" r="14" fill="#f59e0b" />
  </g>
</svg>
